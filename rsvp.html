<!DOCTYPE html>
<html>
<head>
    <title>You're invited! Anas & Nabiha Wedding - RSVP</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <script src="auth.js"></script>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; }
        iframe {
            width: 100%;
            height: 100vh;
            border: none;
        }
    </style>
    <script>
        // Extract code parameter from URL and pass it to the iframe
        function loadIframe() {
            let iframeSrc = 'https://script.google.com/macros/s/AKfycbzDjx4XXpjoxyPpRNO1f-xFHJx91mVE85l2ZDv7JUNQKKTfRGDiFEtx2rOA_kpyn_nb/exec';
            
            // Get code parameter from current URL
            const urlParams = new URLSearchParams(window.location.search);
            const code = urlParams.get('code');
            
            // If code exists, append it to the iframe URL
            if (code) {
                iframeSrc += '?code=' + encodeURIComponent(code);
            }
            
            // Set the iframe src
            document.getElementById('rsvpFrame').src = iframeSrc;
        }
        
        // Load iframe when page is ready
        window.addEventListener('DOMContentLoaded', loadIframe);
    </script>
</head>
<body>
    <iframe id="rsvpFrame"></iframe>
</body>
</html>
