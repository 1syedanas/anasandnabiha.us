<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Registry - Our Wedding Celebration - 2026</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
    :root{
        --sage-green:#7B8E7E;--bg-white:#FFFFFF;--soft-sage:#F4F6F4;--gold:#C5A059;--primary-text:#3A3F3A;
        --serif-font:'Playfair Display',serif;--sans-font:'Lato',sans-serif;
    }
    body,html{margin:0;padding:0;font-family:var(--sans-font);color:var(--primary-text);background:var(--bg-white)}
    .nav-wrapper{width:100%;background:var(--bg-white);padding:25px 0;text-align:center;border-bottom:1px solid var(--soft-sage)}
    .nav-wrapper a{ text-decoration:none;color:var(--sage-green);margin:0 18px;font-size:0.8rem;letter-spacing:2px;text-transform:uppercase;font-weight:700}
    .container{max-width:900px;margin:60px auto;padding:40px;text-align:center}
    h1{font-family:var(--serif-font);font-size:2.4rem;color:var(--sage-green);margin-bottom:10px}
    p.lead{max-width:700px;margin:0 auto;color:var(--primary-text);line-height:1.6}
    .registry-list{margin-top:30px;text-align:left}
    .registry-item{border-top:1px solid #eee;padding:20px 0}
    .btn{display:inline-block;margin-top:12px;padding:10px 22px;border:1px solid var(--gold);color:var(--gold);text-decoration:none;text-transform:uppercase;font-weight:700}
    .btn:hover{background:var(--gold);color:#fff}
    </style>
</head>
<body>
    <nav class="nav-wrapper">
        <a href="index.html#home">Home</a>
        <a href="index.html#schedule">Schedule</a>
        <a href="events.html">Events</a>
        <a href="index.html#travel">Travel</a>
        <a href="registry.html">Registry</a>
        <a href="index.html#activities">Things to Do</a>
        <a href="index.html#faq">FAQ</a>
    </nav>

    <main class="container">
        <h1>Registry</h1>
        <p class="lead">Thank you for your love and support. If you'd like to help us celebrate, you can find our registry below.</p>

        <div class="registry-list">
            <div class="registry-item">
                <strong>Amazon Registry</strong>
                <div><a class="btn" href="#" target="_blank">Visit</a></div>
            </div>
            <div class="registry-item">
                <strong>Zola</strong>
                <div><a class="btn" href="#" target="_blank">Visit</a></div>
            </div>
        </div>
    </main>

    <footer style="text-align:center;padding:40px 0;color:var(--sage-green);opacity:0.7">2026 • MADE WITH LOVE</footer>
</body>
</html>
