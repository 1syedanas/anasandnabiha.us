<!-- HOW TO USE THE SHARED MENU COMPONENT -->

<!-- 
To use the shared menu on any page, follow these steps:

1. In the <head> section, add the menu CSS after your main styles:
   <link rel="stylesheet" href="menu.css">

2. At the end of the <body> section, before your closing </body> tag, add:
   <script src="menu.js"></script>

3. Remove the menu HTML from your page (the entire <nav> section and the page title <h2>)

4. Remove the menu-specific CSS from your page styles (all the .menu-*, .nav-wrapper, .hamburger styles)

5. Remove the menu JavaScript code from your page

That's it! The menu will automatically be inserted and work on any page.

EXAMPLE MINIMAL PAGE:
-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Page Title - Our Wedding</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Playfair+Display+SC:wght@400;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <!-- Your page-specific styles -->
    <style>
        :root {
            --sage-green: #7B8E7E;
            --soft-sage: #F4F6F4;
            --gold: #C5A059;
            --dark-gold: #9E7E3F;
            --primary-text: #3A3F3A;
            --bg-white: #FFFFFF;
            --serif-font: 'Playfair Display', serif;
            --sans-font: 'Lato', sans-serif;
        }

        body, html {
            margin: 0;
            padding: 0;
            font-family: var(--sans-font);
            color: var(--primary-text);
            scroll-behavior: smooth;
            background-color: var(--bg-white);
        }

        /* Your page content styles here */
    </style>
    
    <!-- Include shared menu styles -->
    <link rel="stylesheet" href="menu.css">
</head>

<body>
    <!-- Menu will be automatically inserted here by menu.js -->
    
    <!-- Your page content -->
    <section id="home">
        <h1>Your Page Content</h1>
        <p>The menu is automatically included!</p>
    </section>

    <!-- Include shared menu script at end of body -->
    <script src="menu.js"></script>
    
    <!-- Your page-specific scripts can go here -->
</body>
</html>
