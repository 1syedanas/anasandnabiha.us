<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Registry - Our Wedding Celebration - 2026</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Playfair+Display+SC:wght@400;700&family=Lato:wght@300;400;700&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            /* Color Palette */
            --sage-green: #7B8E7E;
            --soft-sage: #F4F6F4;
            --gold: #C5A059;
            --dark-gold: #9E7E3F;
            --primary-text: #3A3F3A;
            --bg-white: #FFFFFF;

            /* Fonts */
            --serif-font: 'Playfair Display', serif;
            --sans-font: 'Lato', sans-serif;
        }

        body,
        html {
            margin: 0;
            padding: 0;
            font-family: var(--sans-font);
            color: var(--primary-text);
            scroll-behavior: smooth;
            background-color: var(--bg-white);
        }

        .mobile-page-title {
            width: 100%;
            text-align: center;
            display: block;
            overflow: hidden;
            padding: 16px 0;
            margin: 0;
            text-overflow: ellipsis;
            font-family: 'Quicksand', sans-serif;
            color: #404041;
            font-size: 32px;
            font-weight: normal;
            text-transform: uppercase;
            position: sticky;
            top: 0;
            z-index: 999;
            background-color: #FFFFFF;
        }

        @media (max-width: 640px) {
            .mobile-page-title {
                font-size: calc(32px * 0.75);
            }
        }

        /* Top Navigation */
        .nav-wrapper {
            width: auto;
            background: transparent;
            padding: 0;
            text-align: left;
            position: fixed;
            top: 5px;
            left: 5px;
            z-index: 9999;
        }

        .nav-wrapper a {
            text-decoration: none;
            color: var(--sage-green);
            margin: 0 18px;
            font-size: 0.8rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 700;
            transition: color 0.3s;
        }

        .nav-wrapper a:hover {
            color: var(--gold);
        }

        /* Left options menu (replaces top links) */
        .menu-btn {
            width: 46px;
            height: 46px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            border: none;
            cursor: pointer;
            z-index: 9999;
        }

        .hamburger {
            width: 24px;
            height: 1.7px;
            background: var(--sage-green);
            position: relative;
            display: inline-block;
            -webkit-transition: 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            -moz-transition: 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            -ms-transition: 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            transition: 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        .hamburger::before,
        .hamburger::after {
            content: '';
            position: absolute;
            left: 0;
            width: 24px;
            height: 2px;
            background: var(--sage-green);
            -webkit-transition: 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            -moz-transition: 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            -ms-transition: 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            transition: 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        .hamburger::before {
            top: -6px;
        }

        .hamburger::after {
            top: 6px;
        }

        /* Hamburger to X animation */
        .menu-btn.active .hamburger {
            background: transparent;
            /* Hides middle bar */
        }

        /* Change both bars to sage green and ensure they are visible */
        .menu-btn.active .hamburger::before,
        .menu-btn.active .hamburger::after {
            background: var(--sage-green);
            top: 0;
        }

        .menu-btn.active .hamburger::before {
            -webkit-transform: rotate(45deg);
            -moz-transform: rotate(45deg);
            -ms-transform: rotate(45deg);
            transform: rotate(45deg);
        }

        .menu-btn.active .hamburger::after {
            -webkit-transform: rotate(-45deg);
            -moz-transform: rotate(-45deg);
            -ms-transform: rotate(-45deg);
            transform: rotate(-45deg);
        }

        /* Make the button background transparent when menu is open */
        .menu-btn.active {
            background: transparent;
            border-color: transparent;
            box-shadow: none;
        }

        .menu-overlay {
            position: fixed;
            inset: 0;
            background: rgba(244, 246, 244, 0.4);
            /* Frosted glass effect with transparency */
            backdrop-filter: blur(12px) saturate(150%);
            -webkit-backdrop-filter: blur(12px) saturate(150%);
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.35s ease, visibility 0.35s ease;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            z-index: 1050;
        }

        .menu-overlay.open {
            opacity: 1;
            visibility: visible;
        }

        .menu-inner {
            text-align: center;
            position: relative;
            padding-top: 100px;
        }

        .menu-link {
            display: block;
            width: fit-content;
            margin: 0 auto;
            padding: 8px 8px 6px;

            font-family: 'Quicksand', sans-serif;
            font-size: 16px;
            font-weight: 500;
            color: var(--sage-green);
            text-decoration: none;
            letter-spacing: 2px;
            line-height: 1;

            border-bottom: 2px solid transparent;
            transition: all 0.25s;
            
            /* Remove default tap/click highlight */
            -webkit-tap-highlight-color: transparent;
            outline: none;
        }

        /* Active menu item has underline */
        .menu-link.active {
            border-bottom-color: var(--sage-green);
        }

        /* Hover and active state to make it interactive */
        .menu-link:hover,
        .menu-link:active,
        .menu-link:focus {
            color: var(--sage-green);
            border-bottom-color: var(--sage-green);
            transform: translateY(-2px);
            background: rgba(255, 192, 203, 0.15);
            border-radius: 4px;
        }

        /* Mobile scaling as per your snippet */
        @media (max-width: 640px) {
            .menu-link {
                font-size: calc(16px * 0.875);
                margin: 0 auto;
            }
        }

        /* Page transition when navigating between pages */
        body.page-exit {
            opacity: 0;
            transform: translateY(8px);
            transition: opacity 0.42s ease, transform 0.42s ease;
        }

        /* Main Content Container */
        .main-container {
            max-width: 900px;
            margin: 80px auto 0;
            padding: 40px 20px 60px;
            text-align: center;
        }

        .page-header {
            text-align: center;
            margin-bottom: 50px;
        }

        .page-header h1 {
            font-family: var(--serif-font);
            font-size: 3rem;
            color: var(--sage-green);
            margin: 0 0 20px 0;
            font-weight: 400;
        }

        .page-intro {
            max-width: 700px;
            margin: 0 auto;
            color: var(--primary-text);
            line-height: 1.8;
            font-size: 1rem;
        }

        .registry-list {
            margin-top: 50px;
            text-align: center;
        }

        .registry-item {
            border-top: 2px solid #ddd;
            padding: 40px 0;
        }

        .registry-item strong {
            display: block;
            font-size: 1.2rem;
            margin-bottom: 15px;
        }

        .registry-item:first-child {
            border-top: none;
            padding-top: 20px;
        }

        .btn {
            display: inline-block;
            margin-top: 12px;
            padding: 10px 22px;
            border: 1px solid var(--sage-green);
            color: var(--sage-green);
            text-decoration: none;
            text-transform: uppercase;
            font-weight: 700;
            transition: all 0.3s;
        }

        .btn:hover {
            background: var(--sage-green);
            color: #fff;
        }

        footer {
            text-align: center;
            padding: 40px 0;
            color: var(--sage-green);
            opacity: 0.7;
        }
    </style>
</head>

<body>

    <h2 class="mobile-page-title">A&amp;N</h2>

    <nav class="nav-wrapper">
        <button id="menuBtn" class="menu-btn" aria-label="Open navigation" aria-haspopup="true" aria-expanded="false">
            <span class="hamburger" aria-hidden="true"></span>
        </button>
    </nav>

    <div id="menuOverlay" class="menu-overlay" aria-hidden="true">
        <div class="menu-inner" role="dialog" aria-modal="true" aria-label="Site navigation">
            <a href="index.html#home" class="menu-link">Home</a>
            <a href="events.html" class="menu-link">Events</a>
            <a href="travel.html" class="menu-link">Travel</a>
            <a href="index.html#faq" class="menu-link">Q + A</a>
            <a href="index.html#activities" class="menu-link">Things to Do</a>
            <a href="registry.html" class="menu-link">Registry</a>
            <a href="rsvp.html" class="menu-link">RSVP</a>
        </div>
    </div>

    <section class="main-container">
        <div class="page-header">
            <h1>Registry</h1>
        </div>

        <p class="page-intro">Thank you for your love and support. If you'd like to help us celebrate, you can find our registry below.</p>

        <div class="registry-list">
            <div class="registry-item">
                <strong>Amazon Registry</strong>
                <div><a class="btn" href="#" target="_blank">Visit</a></div>
            </div>
            <div class="registry-item">
                <strong>Zola</strong>
                <div><a class="btn" href="#" target="_blank">Visit</a></div>
            </div>
        </div>
    </section>

    <footer>
        <p>2026 • MADE WITH LOVE</p>
    </footer>

    <script>
        // Force page to load at the top
        if (history.scrollRestoration) {
            history.scrollRestoration = 'manual';
        }
        
        // Ensure we start at the top before page loads
        window.addEventListener('beforeunload', function () {
            window.scrollTo(0, 0);
        });
        
        // Scroll to top immediately on load
        window.scrollTo(0, 0);
        
        // Additional scroll to top after page fully loads
        window.addEventListener('load', function() {
            setTimeout(function() {
                window.scrollTo(0, 0);
            }, 0);
        });

        // Invitation Type Handler - Persist type across pages using sessionStorage
        (function() {
            const params = new URLSearchParams(window.location.search);
            let invitationType = params.get('type'); // 'subkuch', 'nikkah', 'nikkahandshalima'
            const storedType = sessionStorage.getItem('invitationType');
            
            // If URL has a type parameter, it always wins
            if (invitationType) {
                // If it differs from stored value and we haven't just reloaded, update and reload
                if (storedType && storedType !== invitationType && !sessionStorage.getItem('_reloadLock')) {
                    // Set a temporary lock to prevent reload loops
                    sessionStorage.setItem('_reloadLock', '1');
                    sessionStorage.setItem('invitationType', invitationType);
                    window.location.reload();
                    return;
                }
                // Clear the reload lock
                sessionStorage.removeItem('_reloadLock');
                sessionStorage.setItem('invitationType', invitationType);
            } else {
                // No type in URL, check sessionStorage
                invitationType = storedType || 'subkuch'; // default to all events
            }
        })();

        // Mark current page in menu
        (function() {
            const currentPage = window.location.pathname.split('/').pop() || 'index.html';
            const menuLinks = document.querySelectorAll('.menu-link');
            menuLinks.forEach(link => {
                const href = link.getAttribute('href');
                // Check if this link matches the current page
                if (href === currentPage || 
                    (currentPage === '' && href === 'index.html') ||
                    (currentPage === 'registry.html' && href === 'registry.html')) {
                    link.classList.add('active');
                }
            });
        })();

        // Top-left options menu + page transition behavior
        (function () {
            const menuBtn = document.getElementById('menuBtn');
            const menuOverlay = document.getElementById('menuOverlay');
            const menuClose = document.getElementById('menuClose');
            const menuLinks = document.querySelectorAll('.menu-link');

            function toggleMenu() {
                const isOpen = menuOverlay.classList.contains('open');
                if (isOpen) {
                    menuOverlay.classList.remove('open');
                    menuBtn.classList.remove('active');
                    menuBtn.setAttribute('aria-expanded', 'false');
                    menuOverlay.setAttribute('aria-hidden', 'true');
                    document.body.style.overflow = '';
                } else {
                    menuOverlay.classList.add('open');
                    menuBtn.classList.add('active');
                    menuBtn.setAttribute('aria-expanded', 'true');
                    menuOverlay.setAttribute('aria-hidden', 'false');
                    document.body.style.overflow = 'hidden';
                }
            }

            if (menuBtn && menuOverlay) {
                menuBtn.addEventListener('click', toggleMenu);
                
                // Close menu when close button is clicked
                menuClose && menuClose.addEventListener('click', toggleMenu);

                // Close if clicking the backdrop itself
                menuOverlay.addEventListener('click', (e) => {
                    if (e.target === menuOverlay) toggleMenu();
                });

                document.addEventListener('keydown', (e) => {
                    if (e.key === 'Escape' && menuOverlay.classList.contains('open')) {
                        toggleMenu();
                    }
                });

                menuLinks.forEach(link => {
                    link.addEventListener('click', (e) => {
                        let href = link.getAttribute('href');
                        if (!href) return;

                        if (href.startsWith('#')) {
                            e.preventDefault();
                            toggleMenu(); // Close menu on click
                            const target = document.querySelector(href);
                            if (target) target.scrollIntoView({ behavior: 'smooth' });
                            return;
                        }

                        // Append invitation type to external links
                        const invitationType = sessionStorage.getItem('invitationType') || 'nikkaha';
                        const separator = href.includes('?') ? '&' : '?';
                        href = href + separator + 'type=' + invitationType;

                        e.preventDefault();
                        toggleMenu(); // Close and animate out
                        document.documentElement.classList.add('page-exit');
                        setTimeout(() => { window.location.href = href; }, 420);
                    });
                });
            }
        })();
    </script>

</body>

</html>
