    <link rel="icon" type="image/png" href="images/favicon.png">
    <link rel="apple-touch-icon" href="https://anasandnabiha.us/images/favicon.png">
    <meta name="theme-color" content="#7B8E7E">
    <meta property="og:title" content="You're invited! Anas & Nabiha Wedding - RSVP">

    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; }
        iframe {
            width: 100%;
            height: 100vh;
            border: none;
        }
    </style>
    <script>
        // Extract code parameter from URL and pass it to the iframe
        function loadIframe() {
            let iframeSrc = 'https://script.google.com/macros/s/AKfycbwBl23tsG4n9jyHujJaXDqhiyk_1K0GXEuPqK7-9u6MGTLj0-mUfSfyG_J6yAv7bJtl/exec';
            
            // Get code parameter from current URL
            const urlParams = new URLSearchParams(window.location.search);
            const code = urlParams.get('code');
            
            // If code exists, append it to the iframe URL
            if (code) {
                iframeSrc += '?code=' + encodeURIComponent(code);
            }
            
            // Set the iframe src
            document.getElementById('rsvpFrame').src = iframeSrc;
        }
        
        // Load iframe when page is ready
        window.addEventListener('DOMContentLoaded', loadIframe);
    </script>
</head>
<body>
    <iframe id="rsvpFrame"></iframe>
</body>
</html>
